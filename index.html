<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending...Sender</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="app-container">
        <!-- Bottom navigation bar -->
        <nav id="bottom-nav" class="bottom-nav">
            <button class="nav-toggle" onclick="toggleBottomNav()">☰</button>

            <div class="nav-items">
                <button onclick="showSection('compose')">Compose</button>
                <button onclick="loadEmails('inbox')">Inbox</button>
                <button onclick="loadEmails('sent')">Sent</button>
                <button onclick="showSection('draft')">Draft</button>
                <button onclick="loadEmails('trash')">Rubbish</button>
                <button onclick="loadEmails('spam')">Spam</button>
            </div>
        </nav>

        <main>
            <div id="compose-section" class="section active">

                <div class="compose-grid">
                    <!-- Left: centered compose form -->
                    <div class="header-title" id="composeTitle">COMPOSE EMAIL</div>
                    <div class="form-area centered-form">

                        <form id="emailForm">
                            <label>Recipient Email</label>
                            <input type="email" name="recipient" id="recipient"
                                placeholder="e.g. sasha.cheung@example.com">
                            <div id="email-error" class="field-error hidden"></div>

                            <label>Subject</label>
                            <input type="text" name="subject" id="subject">
                            <div id="subject-error" class="field-error hidden"></div>

                            <label>Body</label>
                            <textarea name="body" id="body" rows="6"></textarea>
                            <br>
                            <label>Upload Files <br><span class="fileTypes">(PDF, DOCX, TXT, CSV,
                                    XLS/XLSX) max. 4 MB</span></label>
                            <div class="upload-zone">
                                <input type="file" id="fileInput" name="attachments" multiple
                                    accept=".pdf,.docx,.txt,.csv,.xls,.xlsx">
                                <label for="fileInput" class="upload-label">
                                    Drag & drop files here<br>or <span class="browse">browse</span>
                                </label>
                            </div>


                            <div id="attachment-list" class="attachment-list hidden"></div>

                            <button type="submit" id="sendBtn">Send</button>
                            <div id="send-status"></div>
                        </form>


                    </div>
                    <!-- Attachment list (scrolling box) -->
                    <button id="clear-preview-btn" class="clear-preview-btn hidden" onclick="clearPreview()">
                        Clear<br>Preview
                    </button>

                </div>
                <!-- Attachment list (scrolling box) -->
                <button id="clear-preview-btn" class="clear-preview-btn hidden" onclick="clearPreview()">
                    Clear<br>Preview
                </button>
            </div>


            <div id="email-list-section" class="section hidden">
                <div class="header-title" id="folder-title">Inbox</div>
                <div id="email-container" class="email-list">
                    <p>Loading...</p>
                </div>
            </div>
        </main>

        <!-- Warnings – small red text on right side -->
        <div id="warning-panel" class="warning-panel hidden">
            <div class="sensitive-tags-container"></div>
        </div>
    </div>
    </div>
    <!-- Background preview text (full screen, faint) -->
    <div id="preview-bg-layer" class="preview-bg-layer"></div>
    </div>


    <script src="script.js"></script>
</body>

</html>
